<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swaad Express - Order online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Swaad <span>Express</span></div>
    <div class="tag">Thali, biryani and snacks from Indore and Bhopal</div>
  </header>

  <main>
    <section id="screen-menu" class="screen">
      <h1>Menu</h1>
      <div id="menu-list"></div>
    </section>

    <section id="screen-cart" class="screen">
      <h1>Your cart</h1>
      <div id="cart-list"></div>
      <div class="actions">
        <button class="ghost" data-go="menu">Back to menu</button>
        <button id="to-bill" class="primary" data-go="bill">See the bill</button>
      </div>
    </section>

    <section id="screen-bill" class="screen">
      <h1>Your bill</h1>
      <div id="bill-box" class="bill"></div>
      <div class="actions">
        <button class="ghost" data-go="cart">Back to cart</button>
        <button class="primary" data-go="pay">Go to payment</button>
      </div>
    </section>

    <section id="screen-pay" class="screen">
      <h1>Payment</h1>
      <p class="sub">To pay: <strong id="pay-total">₹0.00</strong></p>
      <div id="pay-list"></div>
      <div class="actions">
        <button class="ghost" data-go="bill">Back</button>
        <button id="pay-now" class="primary">Pay now (practice only)</button>
      </div>
    </section>

    <section id="screen-done" class="screen">
      <h1>Order placed</h1>
      <p class="sub">Thank you! This is a practice site, so no real order or payment was made.</p>
      <div class="actions"><button class="primary" data-go="menu">Order again</button></div>
    </section>
  </main>

  <div id="cart-bar" class="cart-bar hidden">
    <span><b id="cart-count">0</b> items · <b id="cart-bar-total">₹0.00</b></span>
    <button class="primary" data-go="cart">View cart</button>
  </div>

  <footer>Practice site for the AIP3 course. Swaad Express is a fictional company.</footer>

  <script src="js/menu.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
